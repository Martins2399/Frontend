<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TaskFlow</a>
        </div>
    </nav>

    <!-- Container Principal -->
    <main class="container my-5" style="max-width: 900px;">
        
        <!-- Form de Nova Tarefa -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 fw-bold text-dark">Nova Tarefa</h4>
                <form id="formTarefa">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="tituloTarefa" class="form-label fw-bold">Título</label>
                            <input type="text" class="form-control" id="tituloTarefa" placeholder="Título da tarefa..." required>
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="prioridadeTarefa" class="form-label fw-bold">Prioridade</label>
                            <select class="form-select" id="prioridadeTarefa" required>
                                <option value="Baixa">Baixa</option>
                                <option value="Média" selected>Média</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="dataLimiteTarefa" class="form-label fw-bold">Data Limite</label>
                            <input type="date" class="form-control" id="dataLimiteTarefa" required>
                        </div>
                        <div class="col-12">
                            <label for="descricaoTarefa" class="form-label fw-bold">Descrição</label>
                            <textarea class="form-control" id="descricaoTarefa" rows="2" placeholder="Descreva brevemente a tarefa..."></textarea>
                        </div>
                        <div class="col-12 d-grid mt-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">+ Adicionar Tarefa</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h4 class="fw-bold mb-3">Minhas Tarefas</h4>

        <!-- Área Vazia id='listaTarefas' para Receber as Tarefas Dinamicamente -->
        <div id="listaTarefas" class="row g-3">
            <!-- Cards gerados via JavaScript -->
        </div>

    </main>

    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container">
            <p class="text-muted mb-0 small">&copy; 2026 TaskFlow - To-Do List com SQLite</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/database.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

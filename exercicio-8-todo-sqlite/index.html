<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List com SQLite</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Biblioteca sql.js (SQLite WASM para Web) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TaskFlow</a>
        </div>
    </nav>

    <!-- Container Principal -->
    <main class="container my-5" style="max-width: 900px;">
        
        <!-- Form de Nova/Editar Tarefa -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h4 id="formTitulo" class="card-title mb-3 fw-bold text-dark">Nova Tarefa</h4>
                
                <!-- Alerta Geral de Validação -->
                <div id="alertaFormulario" class="alert alert-danger d-none" role="alert"></div>

                <form id="formTarefa" novalidate>
                    <input type="hidden" id="tarefaId">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="tituloTarefa" class="form-label fw-bold">Título *</label>
                            <input type="text" class="form-control" id="tituloTarefa" placeholder="Título da tarefa..." required>
                            <div class="invalid-feedback">O título é obrigatório.</div>
                        </div>

                        <div class="col-12 col-md-3">
                            <label for="prioridadeTarefa" class="form-label fw-bold">Prioridade *</label>
                            <select class="form-select" id="prioridadeTarefa" required>
                                <option value="" disabled>Selecione...</option>
                                <option value="Baixa">Baixa</option>
                                <option value="Média" selected>Média</option>
                                <option value="Alta">Alta</option>
                            </select>
                            <div class="invalid-feedback">Selecione uma prioridade válida.</div>
                        </div>

                        <div class="col-12 col-md-3">
                            <label for="dataLimiteTarefa" class="form-label fw-bold">Data Limite *</label>
                            <input type="date" class="form-control" id="dataLimiteTarefa" required>
                            <div class="invalid-feedback">Informe uma data válida.</div>
                        </div>

                        <div class="col-12">
                            <label for="descricaoTarefa" class="form-label fw-bold">Descrição (Máx. 200 caracteres)</label>
                            <textarea class="form-control" id="descricaoTarefa" rows="2" maxlength="200" placeholder="Descreva brevemente a tarefa..."></textarea>
                            <div class="form-text d-flex justify-content-between">
                                <span class="ms-auto"><span id="contadorChars">0</span>/200</span>
                            </div>
                        </div>

                        <div class="col-12 d-flex gap-2 mt-3">
                            <button type="submit" id="btnSalvar" class="btn btn-primary btn-lg fw-bold flex-fill">+ Adicionar Tarefa</button>
                            <button type="button" id="btnCancelarEdicao" class="btn btn-outline-secondary btn-lg fw-bold d-none">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Painel de Filtros -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
            <h4 class="fw-bold mb-0">Minhas Tarefas</h4>
            
            <div class="btn-group" role="group" aria-label="Filtro de tarefas">
                <button type="button" class="btn btn-outline-primary active" data-filtro="todas">Todas</button>
                <button type="button" class="btn btn-outline-primary" data-filtro="pendentes">Pendentes</button>
                <button type="button" class="btn btn-outline-primary" data-filtro="concluidas">Concluídas</button>
            </div>
        </div>

        <!-- Área id='listaTarefas' -->
        <div id="listaTarefas" class="row g-3">
            <!-- Cards gerados via JS/SQLite -->
        </div>

    </main>

    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container">
            <p class="text-muted mb-0 small">&copy; 2026 TaskFlow - To-Do List com SQLite</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/database.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

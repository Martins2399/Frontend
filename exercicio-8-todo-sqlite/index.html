<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Customizado Externo -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <!-- TAREFA 3: Navbar com o nome TaskFlow -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-check2-square me-2"></i>TaskFlow
            </a>
        </div>
    </nav>

    <!-- TAREFA 3: Container principal responsivo -->
    <main class="container my-5" style="max-width: 800px;">
        
        <!-- Card com formulário visual de nova tarefa -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 fw-bold text-dark">Nova Tarefa</h4>
                <form id="formTarefa">
                    <div class="row g-3">
                        <div class="col-12 col-md-8">
                            <input type="text" class="form-control form-control-lg" id="tituloTarefa" placeholder="O que precisa ser feito?" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <select class="form-select form-select-lg" id="categoriaTarefa" required>
                                <option value="" selected disabled>Categoria...</option>
                                <option value="Trabalho">Trabalho</option>
                                <option value="Estudos">Estudos</option>
                                <option value="Pessoal">Pessoal</option>
                            </select>
                        </div>
                        <div class="col-12 d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">+ Adicionar Tarefa</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Área vazia id='listaTarefas' para receber tarefas nas próximas partes -->
        <div id="listaTarefas" class="row g-3">
            <!-- As tarefas serão inseridas dinamicamente aqui via JavaScript -->
        </div>

    </main>

    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container">
            <p class="text-muted mb-0 small">&copy; 2026 TaskFlow - To-Do List com SQLite</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Customizado Externo -->
    <script src="assets/js/database.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>

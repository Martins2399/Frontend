<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TechStore</div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contato-container">
            <div style="width: 100%; text-align: center; margin-bottom: 1rem;">
                <h2>Fale Conosco</h2>
                <p>Envie sua dúvida ou sugestão preenchendo o formulário abaixo.</p>
            </div>
            <form>
                <input type="text" placeholder="Seu Nome" required>
                <input type="email" placeholder="Seu E-mail" required>
                <textarea rows="5" placeholder="Sua Mensagem" required></textarea>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TechStore. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Cadastro e Tarefas</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Adicionar no <head> de index.html, cadastro.html, tarefas.html e api-demo.html -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Menu de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SysControl</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cadastro.html">Cadastro (CEP)</a></li>
                    <li class="nav-item"><a class="nav-link" href="tarefas.html">Tarefas</a></li>
                    <li class="nav-item"><a class="nav-link" href="api-demo.html">API Demo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal: Formulário de Cadastro com Consulta CEP -->
    <main class="container my-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h2 class="mb-4 text-dark fw-bold text-center">Cadastro de Usuário com Consulta CEP</h2>

            <!-- Alerta para mensagens de erro/sucesso do CEP -->
            <div id="alertaCep" class="alert d-none" role="alert"></div>

            <form id="formCadastro">
                <div class="row g-3">
                    <!-- Dados Pessoais -->
                    <div class="col-12 col-md-6">
                        <label for="nome" class="form-label fw-bold">Nome Completo *</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label fw-bold">E-mail *</label>
                        <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="telefone" class="form-label fw-bold">Telefone *</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="cep" class="form-label fw-bold">CEP *</label>
                        <input type="text" class="form-control" id="cep" placeholder="00000-000" maxlength="9" required>
                        <div class="form-text">Digite o CEP para preencher o endereço automaticamente.</div>
                    </div>

                    <!-- Endereço -->
                    <div class="col-12 col-md-9">
                        <label for="rua" class="form-label fw-bold">Rua / Logradouro *</label>
                        <input type="text" class="form-control" id="rua" required>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="numero" class="form-label fw-bold">Número *</label>
                        <input type="text" class="form-control" id="numero" placeholder="Ex: 123" required>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="bairro" class="form-label fw-bold">Bairro *</label>
                        <input type="text" class="form-control" id="bairro" required>
                    </div>

                    <div class="col-12 col-md-5">
                        <label for="cidade" class="form-label fw-bold">Cidade *</label>
                        <input type="text" class="form-control" id="cidade" required>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="estado" class="form-label fw-bold">Estado (UF) *</label>
                        <input type="text" class="form-control" id="estado" maxlength="2" required>
                    </div>

                    <!-- Observações -->
                    <div class="col-12">
                        <label for="observacoes" class="form-label fw-bold">Observações</label>
                        <textarea class="form-control" id="observacoes" rows="3" placeholder="Informações adicionais..."></textarea>
                    </div>

                    <!-- Botão de Envio -->
                    <div class="col-12 d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Cadastrar Usuário</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 SysControl - Exercício 9 Frontend</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>

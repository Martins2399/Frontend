<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Sistema de Cadastro</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar Responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TechStore System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link" href="lista.html">Lista</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal de Contato -->
    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow-sm p-4 border-0">
            <h2 class="card-title text-center mb-3">Fale Conosco</h2>
            <p class="text-muted text-center mb-4">Dúvidas ou suporte referentes ao sistema de cadastro de produtos? Envie sua mensagem.</p>

            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!'); this.reset();">
                <div class="mb-3">
                    <label for="nomeContato" class="form-label fw-bold">Nome Completo</label>
                    <input type="text" class="form-control" id="nomeContato" placeholder="Digite seu nome" required>
                </div>

                <div class="mb-3">
                    <label for="emailContato" class="form-label fw-bold">E-mail</label>
                    <input type="email" class="form-control" id="emailContato" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="assuntoContato" class="form-label fw-bold">Assunto</label>
                    <input type="text" class="form-control" id="assuntoContato" placeholder="Assunto da mensagem" required>
                </div>

                <div class="mb-3">
                    <label for="mensagemContato" class="form-label fw-bold">Mensagem</label>
                    <textarea class="form-control" id="mensagemContato" rows="4" placeholder="Escreva sua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 TechStore System - Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

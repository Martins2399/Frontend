<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos - Sistema de Cadastro</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar Responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">TechStore System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link active" href="lista.html">Lista</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo da Listagem e Painel -->
    <main class="container my-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2>Gerenciamento de Produtos</h2>
            <a href="cadastro.html" class="btn btn-primary">+ Cadastrar Novo Produto</a>
        </div>

        <!-- TAREFA 5: Cards de Resumo Estatístico -->
        <div class="row mb-4">
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <div class="card bg-light border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted text-uppercase mb-1">Total de Produtos</h6>
                    <span id="totalProdutos" class="h3 fw-bold text-dark mb-0">0</span>
                </div>
            </div>
            <div class="col-12 col-md-4 mb-3 mb-md-0">
                <div class="card bg-light border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted text-uppercase mb-1">Produtos Ativos</h6>
                    <span id="produtosAtivos" class="h3 fw-bold text-success mb-0">0</span>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card bg-light border-0 shadow-sm text-center p-3">
                    <h6 class="text-muted text-uppercase mb-1">Valor do Estoque</h6>
                    <span id="valorEstoque" class="h3 fw-bold text-primary mb-0">R$ 0,00</span>
                </div>
            </div>
        </div>

        <!-- TAREFA 2: Campo de Busca -->
        <div class="card p-3 border-0 shadow-sm mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-md-12">
                    <input type="text" id="campoBusca" class="form-control form-control-lg" placeholder="🔍 Buscar produto pelo nome...">
                </div>
            </div>
        </div>

        <!-- Área dos Cards de Produtos -->
        <div id="listaProdutos" class="row">
            <!-- Renderizado via JS -->
        </div>
    </main>

    <!-- Bootstrap 5 JS e Script Local -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>

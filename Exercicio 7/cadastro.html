<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Sistema de Cadastro</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar Responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">TechStore System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link" href="lista.html">Lista</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo do Formulário -->
    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow-sm p-4">
            <h2 class="card-title text-center mb-4">Cadastrar Novo Produto</h2>

            <!-- Mensagem de Sucesso (Alerta oculto por padrão) -->
            <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">
                Produto cadastrado com sucesso!
            </div>

            <!-- TAREFA 1: Formulário Responsivo -->
            <form id="formCadastro">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text" class="form-control" id="nome" required placeholder="Ex: Teclado Mecânico">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <select class="form-select" id="categoria" required>
                            <option value="" selected disabled>Selecione...</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Acessórios">Acessórios</option>
                            <option value="Wearables">Wearables</option>
                            <option value="Fotografia">Fotografia</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="preco" required placeholder="0.00">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="estoque" class="form-label">Estoque (Unidades)</label>
                        <input type="number" min="0" class="form-control" id="estoque" required placeholder="Ex: 10">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" required>
                            <option value="Ativo" selected>Ativo</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-3">
                    <button type="submit" class="btn btn-primary btn-lg">Cadastrar Produto</button>
                    <a href="lista.html" class="btn btn-outline-secondary">Ver Produtos Cadastrados</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Bootstrap 5 JS e Script Local -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
